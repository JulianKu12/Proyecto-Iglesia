{% extends "base.html" %}
{% block title %}Calendario{% endblock %}
{% block content %}<h1>Calendario</h1><div id="calendario"></div><div id="calendario-error" class="alert alert-warning d-none">No se pudo cargar el calendario. <a href="{% url 'eventos' %}">Ver listado de eventos</a>.</div><style>.evento-cancelado{text-decoration:line-through}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script><script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script><script>document.addEventListener('DOMContentLoaded',function(){if(!window.FullCalendar){document.getElementById('calendario-error').classList.remove('d-none');return;}new FullCalendar.Calendar(document.getElementById('calendario'),{locale:'es',initialView:'dayGridMonth',firstDay:1,headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,listWeek'},events:'{% url "calendario_datos" %}',eventClick:function(info){if(info.event.url){info.jsEvent.preventDefault();window.location=info.event.url;}}}).render();});</script>{% endblock %}
