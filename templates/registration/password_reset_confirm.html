{% extends "base.html" %}{% block content %}<h1>Restablecer contraseña</h1>{% if validlink %}<form method="post" class="card card-body">{% csrf_token %}{% include "includes/form_fields.html" %}<div class="d-flex gap-2"><button class="btn btn-primary">Guardar contraseña</button><a class="btn btn-outline-secondary" href="{% url 'login' %}">Cancelar</a></div></form>{% else %}<div class="alert alert-danger">El enlace no es válido o ya venció. Solicita uno nuevo.</div><a class="btn btn-primary" href="{% url 'password_reset' %}">Solicitar otro enlace</a>{% endif %}{% endblock %}
