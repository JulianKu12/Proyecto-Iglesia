{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="login-card text-center">
{% if configuracion_iglesia.logotipo %}<img src="{{ configuracion_iglesia.logotipo.url }}" alt="Logotipo de {{ nombre_iglesia }}" class="img-fluid mb-3" style="max-height: 120px;">{% endif %}
<h1>{{ nombre_iglesia }}</h1><p class="text-muted">Iniciar sesión</p>
<form method="post" class="card card-body">
    {% csrf_token %}{% include "includes/form_fields.html" %}
    <button class="btn btn-primary" type="submit">Entrar</button>
    <a class="mt-3" href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
</form>
</div>
{% endblock %}
