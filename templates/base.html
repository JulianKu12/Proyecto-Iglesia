<!doctype html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestión Iglesia{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'inicio' %}">Iglesia</a>
        {% if user.is_authenticated %}
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
            {% if user.groups.all.0.name == "Administrador" %}
            <a class="nav-link" href="{% url 'usuarios' %}">Usuarios</a>
            {% endif %}
        </div>
        <form class="ms-auto" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-link text-white text-decoration-none" type="submit">Cerrar sesión</button>
        </form>
        {% endif %}
    </div>
</nav>
<main class="container py-4">
    {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
