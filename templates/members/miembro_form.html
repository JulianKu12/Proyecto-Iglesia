{% extends "base.html" %}
{% block title %}Miembro{% endblock %}
{% block content %}<h1>{% if miembro %}Editar miembro{% else %}Nuevo miembro{% endif %}</h1><form method="post" class="card card-body">{% csrf_token %}{% include "includes/form_fields.html" %}<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button><a class="btn btn-outline-secondary" href="{% if miembro %}{% url 'miembro_detalle' miembro.pk %}{% else %}{% url 'miembros' %}{% endif %}">Cancelar</a></div></form>{% endblock %}
