{% extends "base.html" %}
{% block title %}Ingresos por periodo{% endblock %}
{% block content %}<h1>Ingresos por periodo</h1><form method="get" class="d-flex gap-2 mb-3"><input type="date" name="desde" value="{{ desde|date:'Y-m-d' }}" class="form-control"><input type="date" name="hasta" value="{{ hasta|date:'Y-m-d' }}" class="form-control"><button class="btn btn-primary">Calcular</button></form><p>Total vigente: <strong>${{ resumen.total|floatformat:2 }} MXN</strong></p><p>Cantidad de aportaciones: {{ resumen.cantidad }}</p><a class="btn btn-outline-secondary" href="{% url 'aportaciones' %}">Volver</a>{% endblock %}
